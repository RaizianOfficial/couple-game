<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#831843" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#skyGrad)"/>
  
  <!-- Ground hill -->
  <path d="M 0 380 Q 256 310 512 380 L 512 512 L 0 512 Z" fill="#bbf7d0" opacity="0.9"/>
  <path d="M 0 420 Q 256 360 512 420 L 512 512 L 0 512 Z" fill="#86efac"/>

  <!-- Cute Town Cottage -->
  <g filter="url(#softShadow)">
    <!-- Roof -->
    <polygon points="256,150 150,240 362,240" fill="#f472b6" stroke="#db2777" stroke-width="6" stroke-linejoin="round"/>
    <!-- Chimney -->
    <rect x="300" y="140" width="28" height="45" fill="#fbcfe8" stroke="#db2777" stroke-width="4" rx="4"/>
    <circle cx="314" cy="120" r="10" fill="#ffffff" opacity="0.6"/>
    <circle cx="324" cy="100" r="14" fill="#ffffff" opacity="0.4"/>
    <!-- House body -->
    <rect x="175" y="235" width="162" height="135" fill="#fef08a" stroke="#ca8a04" stroke-width="6" rx="12"/>
    <!-- Door -->
    <path d="M 230 370 L 230 300 Q 256 280 282 300 L 282 370 Z" fill="#fb923c" stroke="#c2410c" stroke-width="5"/>
    <circle cx="272" cy="336" r="4" fill="#fef08a"/>
    <!-- Window -->
    <rect x="195" y="260" width="30" height="30" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="4"/>
    <line x1="210" y1="260" x2="210" y2="290" stroke="#0284c7" stroke-width="3"/>
    <line x1="195" y1="275" x2="225" y2="275" stroke="#0284c7" stroke-width="3"/>
  </g>

  <!-- Trees -->
  <g>
    <!-- Left tree -->
    <rect x="100" y="320" width="16" height="50" fill="#b45309" rx="4"/>
    <circle cx="108" cy="300" r="34" fill="#a7f3d0"/>
    <circle cx="108" cy="290" r="24" fill="#6ee7b7"/>

    <!-- Right tree -->
    <rect x="400" y="330" width="16" height="50" fill="#b45309" rx="4"/>
    <circle cx="408" cy="315" r="32" fill="#fed7aa"/>
    <circle cx="408" cy="305" r="22" fill="#fbcfe8"/>
  </g>

  <!-- Two Little Floating Hearts -->
  <path d="M 235 120 C 235 110, 222 102, 212 112 C 202 102, 189 110, 189 120 C 189 135, 212 148, 212 148 C 212 148, 235 135, 235 120 Z" fill="#ec4899"/>
  <path d="M 276 95 C 276 87, 265 80, 257 88 C 249 80, 238 87, 238 95 C 238 107, 257 118, 257 118 C 257 118, 276 107, 276 95 Z" fill="#f43f5e"/>

  <!-- Sparkles -->
  <polygon points="120,180 125,195 140,200 125,205 120,220 115,205 100,200 115,195" fill="#fde047"/>
  <polygon points="410,170 414,182 426,186 414,190 410,202 406,190 394,186 406,182" fill="#fde047"/>
</svg>
